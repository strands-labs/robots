site_name: Strands Robots
site_url: https://strands-labs.github.io/robots/
site_description: One Robot object, any robot, in simulation or on real hardware, driven by an agent.
repo_url: https://github.com/strands-labs/robots
repo_name: strands-labs/robots
edit_uri: edit/main/docs/
strict: true
docs_dir: docs
exclude_docs: |
  hooks/

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Space Grotesk
    code: JetBrains Mono
  logo: assets/img/mark.svg
  favicon: assets/img/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: paper
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Paper
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - path: assets/viewer/robot-viewer.js
    type: module

extra:
  generator: false
  # The prompt a page with `copy_prompt: true` offers to a coding agent.
  agent_prompt: >-
    Walk me through https://strands-labs.github.io/robots/start/ one page at a time. Install
    strands-robots with the sim-mujoco extra in a Python 3.12 virtual environment, move the
    simulated SO-101 from the First robot page, then hand it to a Strands Agent from the First
    agent page. Ask whether I have a physical SO-101 on USB before the First real arm page, and
    run strands-robots doctor if any step fails.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/strands-labs/robots
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/strands-robots/

hooks:
  - docs/hooks/facts.py
  - docs/hooks/extras.py
  - docs/hooks/manifest.py
  - docs/hooks/coverage.py
  - docs/hooks/robot_pages.py
  - docs/hooks/providers.py
  - docs/hooks/tools_ref.py
  - docs/hooks/env_vars.py
  - docs/hooks/refusals.py
  - docs/hooks/module_map.py
  - docs/hooks/drivers.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            docstring_options:
              warnings: false
              warn_unknown_params: false
            docstring_section_style: table
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_if_no_docstring: false
            show_root_toc_entry: false
            allow_inspection: false
            heading_level: 3
