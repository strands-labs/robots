<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Fleet cockpit for the strands-robots mesh" />
    <!-- iOS treats a home-screen launch as a separate app: without these it opens
         in Safari chrome, which costs ~90px of a phone screen and shows the URL
         bar over the camera stage. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Robots" />
    <!-- A phone controlling a robot arm should not zoom on a double tap. -->
    <meta name="format-detection" content="telephone=no" />
    <title>Strands Robots</title>
    <script type="module" crossorigin src="/static/app.js"></script>
    <link rel="modulepreload" crossorigin href="/static/vendor/react.js">
    <link rel="stylesheet" crossorigin href="/static/assets/index.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
