#cloud-config
# Droplet bootstrap, rendered by cloud.sh (placeholders @@...@@). The droplet is disposable: everything that
# must survive a teardown lives on the attached volume, mounted at /opt/strands-cloud.
ssh_pwauth: false
disable_root: true
ssh_deletekeys: true
ssh_genkeytypes: []
# Fixed host key (GitHub secret DO_HOST_KEY), so known_hosts stays valid across rebuilds.
ssh_keys:
  ed25519_private: |
@@HOST_KEY_PRIVATE@@
  ed25519_public: @@HOST_KEY_PUBLIC@@
users:
  - name: deploy
    shell: /bin/bash
    ssh_authorized_keys:
      - @@DEPLOY_PUBKEY@@
package_update: true
packages: [ca-certificates, curl, ufw]
swap:
  filename: /swapfile
  size: 2G
runcmd:
  - mkdir -p /opt/strands-cloud
  - dev=/dev/disk/by-id/scsi-0DO_Volume_@@VOLUME@@; for i in $(seq 1 30); do [ -e "$dev" ] && break; sleep 2; done
  - blkid "/dev/disk/by-id/scsi-0DO_Volume_@@VOLUME@@" || mkfs.ext4 -L strands "/dev/disk/by-id/scsi-0DO_Volume_@@VOLUME@@"
  - echo "/dev/disk/by-id/scsi-0DO_Volume_@@VOLUME@@ /opt/strands-cloud ext4 defaults,nofail,discard 0 2" >> /etc/fstab
  - mount -a
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw allow 443/udp && ufw allow 7447/tcp && ufw --force enable
  - install -d -o deploy -g deploy /opt/strands-cloud/strands /opt/strands-cloud/hf-cache
  - install -d -m 700 -o deploy -g deploy /opt/strands-cloud/dashboard-auth
  - chown deploy:deploy /opt/strands-cloud
  - touch /var/lib/strands-ready
