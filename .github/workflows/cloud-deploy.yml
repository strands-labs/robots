# Fork: build the Strands image, push it to GHCR, deploy it to the DigitalOcean droplet.
# Runs on every push to main (and by hand). Needs repo secrets:
#   DO_HOST         droplet IP or hostname
#   DO_SSH_KEY      private key of the droplet's `deploy` user (setup-droplet.sh installed its public half)
#   DO_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <DO_HOST>` output, checked once by hand
name: Cloud deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'tests/**', 'tests_integ/**', 'changelog.d/**']
  workflow_dispatch:

concurrency:
  group: cloud-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository_owner == 'Jacob-Brokloff'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/strands-xlerobot:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: STRANDS_VERSION=0.0.0+jacere.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: cloud
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Copy stack files
        env:
          HOST: ${{ secrets.DO_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy deploy/cloud/docker-compose.yml deploy/cloud/Caddyfile deploy/cloud/deploy.sh \
            "deploy@$HOST:/opt/strands-cloud/"
          scp -i ~/.ssh/id_deploy deploy/strands/user_robots.json "deploy@$HOST:/opt/strands-cloud/strands/"
      - name: Deploy
        env:
          HOST: ${{ secrets.DO_HOST }}
          IMAGE: ${{ needs.build.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        # The short-lived job token goes over stdin, never on a command line.
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy "deploy@$HOST" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null \
             && cd /opt/strands-cloud && chmod +x deploy.sh && ./deploy.sh '$IMAGE'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
