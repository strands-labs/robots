# .github/workflows/changelog-fragment.yml
#
# Refuses a pull request that breaks the `changelog.d/` fragment convention in
# either of the two ways it can be broken: writing a new entry straight into
# `CHANGELOG.md`'s `## [Unreleased]` section instead of recording it as a fragment,
# or adding a fragment the assembler would refuse.
#
# The rule is stated in `changelog.d/README.md` and in `AGENTS.md`, and its cost
# is measured rather than stylistic: every branch appends at the same anchor, so
# two open at once conflict on ordering alone, and because a push dismisses a
# stale approval, clearing that conflict costs a full re-approval round per
# affected branch. Sixty-seven fragments follow the rule. Nothing enforced it:
# with three entries inserted directly beneath `## [Unreleased]`,
# `assemble_changelog.py --check` exits 0 and the 30 tests in
# `tests/test_changelog_format.py` + `tests/test_changelog_fragments.py` all
# pass, because a fragment that was never written leaves nothing to inspect.
# See issue #1784 and scripts/check_changelog_fragment.py for the full account.
#
# The second half was measured before it was added. Fragment validity was enforced
# only by `tests/test_changelog_fragments.py`, inside `call-test-lint / Test and
# Lint` -- so on #2144, whose only defect was a fragment first line reading
# `Fixed: ...` instead of `### Fixed: ...`, this job reported SUCCESS in 10s while
# the required suite reported FAILURE 20.8 minutes later, worded as a test failure
# on a branch whose diff was 28 lines of `strands_robots/utils.py` and two test
# files. The check named for the convention passed the one pull request whose only
# defect was the convention. See issue #2163.
#
# Only the fragments the branch adds or modifies are read, never the whole
# directory: `validate_fragments()` walks all 315 pending fragments, so wiring that
# in would fail a branch for a malformed fragment already on the base. The rules
# themselves are the assembler's `FRAGMENT_NAME` and `validate_fragment`, imported
# rather than restated, so this job and `assemble_changelog.py --check` cannot
# disagree about whether a fragment is valid.
#
# The first half is a base diff and not a test because `[Unreleased]` on `main` already
# carries 168 entries from before the convention existed, so no static assertion
# about the section's contents can hold. What is wrong is the act of adding to
# it, and an act is only visible between two commits.
#
# The release path stays open: `assemble_changelog.py --apply` renders a fragment
# verbatim and deletes the fragment it consumed, so each entry a release adds is
# matched to a fragment deleted in the same diff. That is checked per entry, so a
# release that also hand-writes an entry is still refused.
#
# The remedy is self-clearing, as with the merge-base overlap check: moving the
# entry into a fragment removes the addition from the diff, so doing the thing
# the check asks for makes it pass and no bypass switch is needed.
#
# Whether a failure here blocks a merge is a branch-protection decision, not a
# property of this file. Until the job is added to the required set it surfaces
# the addition and leaves the call to the reviewer.
#

name: Changelog Fragment Check

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fragment:
    name: Refuse a changelog entry that breaks the fragment convention
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The BASE branch, not the pull request head. This job reads two different
      # things from two different places: the *question* is about the branch, but
      # the *script that answers it* has to come from a tree guaranteed to contain
      # it, and the branch under review is not that tree.
      #
      # A branch that forked before this check landed does not carry the script, so
      # running it out of the head tree dies before the check begins:
      #
      #     python3: can't open file '.../check_changelog_fragment.py'
      #     Process completed with exit code 2
      #
      # The script reserves exit 1 for a real finding and 0 for clean. 2 is neither,
      # and the checks UI renders 1 and 2 as the same red X - so the gate accuses a
      # branch that may have done nothing wrong, and can never report its real
      # signal there because it never gets far enough to compute one. Nor is such a
      # branch an edge case: a `pull_request` workflow definition is read from the
      # merge commit, so this job runs against heads that contain neither it nor
      # the script. Measured on #1786, forked one commit before the gate it failed.
      # See issue #1791.
      #
      # Checking out the base costs no fidelity, because the script reads no file
      # from the working tree at all - `git show <rev>:<path>` and
      # `git diff <a>..<b>` for every input, so only reachability matters, and the
      # fetch below settles that. The commit under test is named by `--head`
      # instead, which is what that argument is documented for. Pinned by
      # tests/test_changelog_fragment_gate.py::test_the_verdict_does_not_depend_on_the_checked_out_tree
      - name: Checkout the base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.base_ref }}
          # Full history: a merge base cannot be computed in a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      # `refs/pull/<n>/head` rather than the head SHA on its own, because it is the
      # one name that resolves for a fork's branch as well as for a branch in this
      # repository, and pull requests here come from forks. This only makes the
      # commit reachable; which commit is checked is still the SHA passed to
      # `--head` below. A push racing this fetch cannot leave that SHA unreachable,
      # because the concurrency group above cancels this run when it arrives.
      - name: Fetch the pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # Standard library only, so there is nothing to install. The script writes
      # its report to the job summary and emits a CHANGELOG.md annotation per
      # unaccounted entry.
      #
      # `--head` is the pull request's head SHA, deliberately not the default
      # refs/pull/<n>/merge commit. This check is not in fact defeated by that
      # commit - it asks what entries the head carries that the base does not, and
      # a branch's appended entry is on the head and absent from the base whichever
      # commit is used, measured by
      # tests/test_changelog_fragment_gate.py::test_a_merge_commit_head_still_sees_the_branchs_append
      # - but naming the head keeps the report about the commit under review.
      - name: Check the branch's entries and the fragments it adds
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_changelog_fragment.py --base-ref "$BASE_REF" --head "$HEAD_SHA"
