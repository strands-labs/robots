name: Publish Python Package

on:
  release:
    types:
      - published
  # A publish that GitHub refused at startup (v0.5.2: the caller granted the
  # reusable job less than it asks for) can be re-run against the same tag
  # without re-publishing the release. The PyPI trusted publisher is bound to
  # this file and the `pypi` environment, not to the event.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish (for example v0.5.2)
        required: true
        type: string

jobs:
  call-test-lint:
    uses: ./.github/workflows/test-lint.yml
    # A reusable workflow's job may hold no permission its caller did not grant;
    # test-lint.yml asks for pull-requests: read (#3822), so this caller grants
    # it or GitHub refuses the whole run before any job starts (startup_failure).
    permissions:
      contents: read
      pull-requests: read
    with:
      # Test the branch the release (or the dispatch) came from, not the tag:
      # on a release event GitHub already hands over target_commitish (main),
      # and a dispatched re-publish must not re-run a frozen tag's tests
      # against today's unpinned dependencies (v0.5.2's tag tree greps
      # huggingface_hub's hf.py, which 1.32.0 rewrote the day of the
      # re-publish). The tag is still what `build` checks out below.
      ref: ${{ github.event.release.target_commitish || github.ref_name }}

  build:
    name: Build distribution
    permissions:
      contents: read
    needs:
      - call-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # The tag; on a release event github.ref already is the tag. A v1
          # tree states its own version (`hatch version` reads the tree, not
          # the tag), and Validate version below refuses a tag that is not
          # v<that version>.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # hatchling 1.32+ (2026-08-11) writes Metadata-Version 2.5, which the
        # twine bundled in the pinned pypa/gh-action-pypi-publish rejects
        # ("'2.5' is not a valid metadata version") — that is how v0.5.2's
        # first publish run died at the very last step (run 35206733145).
        # v0.5.1 built with hatchling 1.31 and Metadata 2.4. Build without
        # isolation so this pin, not the tag's [build-system], decides the
        # backend; the pyproject pin covers local `uv pip install -e .`.
        # hatch-vcs is for a v0.5 tag re-published by dispatch: its pyproject
        # derives the version from the tag. A v1 tree does not use it.
        run: |
          python -m pip install --upgrade pip
          pip install hatch twine build 'hatchling<1.32' hatch-vcs

      - name: Validate version
        # A release (X.Y.Z) or a pre-release (X.Y.ZaN, X.Y.ZbN, X.Y.ZrcN; M2
        # is 1.0.0rc1), never a .devN; and only under the tag that names it:
        # a release commit that forgot to set its version, or a tag on the
        # wrong commit, would otherwise publish whatever the tree says under
        # that tag. The tag reaches the script through env, never by
        # expression interpolation into it.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(hatch version)
          echo "tag ${TAG}, hatch version ${version}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "Invalid version format: ${version} (want X.Y.Z or X.Y.Z{a,b,rc}N)"
              exit 1
          fi
          if [[ "v${version}" != "${TAG}" ]]; then
              echo "Version ${version} is not the tag ${TAG}"
              exit 1
          fi
          echo "Valid version format"

      - name: Build
        run: |
          python -m build --no-isolation
          python - <<'PY'
          # Fail here, not in the deploy job, if the backend ever moves the
          # metadata version past what the publisher's twine understands.
          import glob, zipfile
          for whl in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(whl) as z:
                  meta = next(n for n in z.namelist() if n.endswith("/METADATA"))
                  first = z.read(meta).decode().splitlines()[0]
              print(whl, first)
              assert first in ("Metadata-Version: 2.1", "Metadata-Version: 2.2",
                               "Metadata-Version: 2.3", "Metadata-Version: 2.4"), first
          PY
          twine check --strict dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  deploy:
    name: Upload release to PyPI
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/strands-robots
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # release/v1