name: CI

on:
  # No 'types' override: the default (opened, synchronize, reopened) is exactly
  # the set that can change 'pull_request.head.sha', which is what moves the
  # refs/pull/<n>/merge commit handed to the reusable workflow below. Subscribing to an event that cannot change it -
  # this workflow was also started by ready_for_review, review_requested and
  # review_request_removed - cannot produce a new verdict, and because the
  # concurrency group below cancels in progress, it discards the in-flight run of
  # the repository's one required check to recompute the same commit. Measured on
  # #1899, #1901 and #1902: requesting two reviewers seconds after opening left
  # each head sha carrying both a CANCELLED and a SUCCESS
  # 'call-test-lint / Test and Lint', and the roll-up state computed from that
  # pair does not settle between reads (#1914). Pinned by
  # tests/test_pull_request_trigger_types.py.
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  schedule:
    # CodeQL's weekly scan, kept from codeql.yml: catches query-pack drift even
    # when no pull request lands. Only the `security` job runs on this event.
    - cron: '0 6 * * 1'
# Cancelling is right per pull request and wrong per commit, so the key differs by
# event, and the fallback is the half that matters. On a 'pull_request' event
# 'github.event.pull_request.number' is set: the group is per pull request, a new push
# supersedes the previous verdict about the same branch, and discarding the in-flight
# run is the point. That branch of the expression is untouched.
#
# On a push to 'main' or 'dev' the number is empty. Keyed on 'github.ref' the fallback
# was 'refs/heads/main' for *every* commit - one group for the whole branch - so each
# merge cancelled the previous merge's run and left the commit it was testing with a
# permanently unfinished 'call-test-lint'. A cancelled context is not SUCCESS and one
# non-SUCCESS context drags 'statusCheckRollup.state' to FAILURE, so that commit read
# red forever with no failing check anywhere in it, and unlike a branch it gets no next
# push to clear it. Measured over the last 25 commits on 'main' (#2304): 11 red, of
# which 9 had no failing check at all. #1800 measured the same mechanism on
# #1788/#1794/#1796 and concluded it was tolerable to read around; what #2304 adds is
# that the misread destroys the evidence for *which* commit in a burst broke 'main', in
# the same burst that creates the fault - #2303 read rollups along the branch to date a
# breakage while two of the commits it read were red only from cancellation.
#
# 'github.sha' is the commit, so each pushed commit gets its own group and runs to
# completion. Not interchangeable with keeping 'github.ref' and setting
# 'cancel-in-progress: ${{ github.event_name == 'pull_request' }}': that leaves one group
# for the branch, and GitHub holds at most one *pending* run per group, so in a burst of
# three merges the third cancels the second while it is still queued - reproducing the
# CANCELLED context this removes. The cost is that a burst of N merges runs N suites
# instead of 1, which is the point: on a branch nobody rewrites, each commit is a
# distinct artifact and 'was this commit green' is a question only its own completed run
# can answer. Pinned by tests/test_push_concurrency_group.py.
#
# The event name is part of the key for the reason codeql.yml carried it: the
# weekly scan runs against the same `github.sha` as the last push to main, and
# without it a scan starting while that push's run is in flight would cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The one required check (ruleset `default`: context `call-test-lint / Test
  # and Lint`). The job id and the callee's job name are what that context is
  # made of, so both stay as they are. On a pull request its first step is the
  # changelog fragment check (scripts/check_changelog_fragment.py).
  call-test-lint:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/test-lint.yml
    permissions:
      contents: read
      # check_closing_reference.py reads closingIssuesReferences over GraphQL;
      # a fork's read-only token carries this scope, so cross-repository pull
      # requests are graded the same way.
      pull-requests: read
    with:
      # The tree the one required check evaluates. On a 'pull_request' event this is
      # the merge commit GitHub keeps at refs/pull/<n>/merge (head + base tip), not
      # the head sha: the head is a tree that will never exist on 'main', and a
      # branch that forked before a fix landed on 'main' is red on it while the
      # tree its merge would produce is green (#2796). The grader that went red
      # dismissed the approval to clear, on a branch that needed no change. The
      # sibling gates that DO read the head (merge-base-overlap) say why in place;
      # this one wants the tree that merges, which is what lockfile-parity checks
      # out for the same reason. On a push there is no merge commit: 'github.sha'.
      ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

  # The second and last check row: CodeQL and the dependency review in one job.
  # Folded from codeql.yml and dependency-review.yml with their steps unchanged.
  security:
    name: Security
    runs-on: ubuntu-latest
    # 3.8 min median / 4.1 max over the last 49 CodeQL runs; CodeQL scales with
    # the tree, so the headroom is deliberate. The dependency review adds seconds.
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.29.4
        with:
          languages: python
          # security-and-quality covers taint flows (LLM input -> subprocess /
          # XML / paths) plus broader quality lints. Catches the bug class
          # surfaced in PR #85 (MJCF interpolation) and PR #90 (subprocess
          # injection / path traversal).
          queries: security-and-quality
          # Filters out two note-severity quality rules from that suite whose
          # every instance in this repository is an idiom the codebase is
          # obliged to use. The file carries the per-rule reasoning and the
          # reason a filter is needed at all; see #1810.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.29.4
        with:
          category: "/language:python"
          # Findings appear in the Security tab. This step never fails on an
          # alert, which is NOT the same as a pull request being free to merge
          # with one: github-advanced-security opens a review thread per new
          # alert and the default ruleset requires thread resolution, so any
          # new alert is a hard merge gate whatever its severity. The two
          # note-severity rules whose every instance is an unavoidable idiom
          # are filtered in codeql-config.yml for exactly that reason; every
          # other rule -- py/empty-except included -- still gates a merge and
          # still needs a human read (#1810).

      # Hard fail: a new dependency with a known high or critical CVE. This is
      # the only thing in the security baseline that blocks on its own status.
      # License changes are surfaced in the log but do not block. The action
      # compares the pull request's manifests against the base, so it has
      # nothing to read on a push or on the weekly scan.
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9  # v4.7.1
        with:
          fail-on-severity: high
          # The job log and summary are the report. No bot comment.
          comment-summary-in-pr: never
