name: Test and Lint

# The required check: the changelog fragment check (pull requests only), lint, the test suite and the strict docs build.
# The job id and name stay `test-lint` / "Test and Lint" so the ruleset's required
# context `call-test-lint / Test and Lint` (called from ci.yml) is unchanged.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      MUJOCO_GL: egl
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          # Need history so the fragment check can diff the branch against the base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Before anything is installed: a branch that writes a `### ` entry straight
      # into CHANGELOG.md's [Unreleased], or adds a fragment the assembler refuses,
      # hears about it here in seconds instead of after the suite (changelog.d/README.md).
      # HEAD_SHA is the pull request head, deliberately not the merge commit this job
      # checks out: a merge commit already contains the base tip, which defeats the
      # diff. The head is the merge commit's second parent, so it is reachable.
      - name: Changelog fragment
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}" || true
          python3 scripts/check_changelog_fragment.py --base-ref "${BASE_REF}" --head "${HEAD_SHA}"

      - name: Install system dependencies (EGL for headless MuJoCo)
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libosmesa6

      - name: Install hatch
        run: pip install --no-cache-dir hatch

      - name: Run lint
        run: hatch run lint

      - name: Run tests
        run: hatch run test -q

      - name: Build the docs (strict)
        run: |
          pip install --no-cache-dir -r docs/requirements.txt
          mkdocs build --strict
