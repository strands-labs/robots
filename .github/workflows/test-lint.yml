name: Test and Lint

# v1 (dev branch): the required check is lint + the test suite, nothing else.
# The job id and name stay `test-lint` / "Test and Lint" so the ruleset's required
# context `call-test-lint / Test and Lint` (called from ci.yml) is unchanged.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      MUJOCO_GL: egl
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (EGL for headless MuJoCo)
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libosmesa6

      - name: Install hatch
        run: pip install --no-cache-dir hatch

      - name: Run lint
        run: hatch run lint

      - name: Run tests
        run: hatch run test -q

      - name: Build the docs (strict)
        run: |
          pip install --no-cache-dir -r docs/requirements.txt
          mkdocs build --strict
