[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-robots"
version = "1.0.0.dev0"
description = "A Simulation is a world, a Robot is a body in a world (or on a bus), a Policy turns an observation into an action."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "robot_descriptions>=1.12",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.3.4"]
feetech = ["pyserial>=3.5"]
# ONNX policies (holosoma, microduck presets): CPU inference, weights fetched from the Hugging Face Hub.
onnx = ["onnxruntime>=1.18", "huggingface_hub>=0.24"]
# LeRobot policies, local or over Zenoh (Python 3.12). remote_inference is on LeRobot main only (0.6.1 on PyPI
# predates it) and a wheel cannot carry a git reference, so LeRobot itself is installed by hand: see _extras.LEROBOT.
# zenoh <1.11: the range LeRobot main's `remote` extra resolves, so installing both never downgrades it.
lerobot = ["eclipse-zenoh>=1.9.0,<1.11.0 ; python_version >= '3.12'"]
# GPU worlds (CUDA). Measured on an L40S with isaacsim 6.1.0 (index https://pypi.nvidia.com), mujoco-warp 3.11.0,
# warp-lang 1.19 and mujoco 3.11.
isaac = ["isaacsim[all,extscache]>=6.1,<6.2 ; python_version >= '3.12'"]
newton = ["mujoco-warp>=3.11", "warp-lang>=1.10"]
# robot.tool / sim.tool: the strands agent tool generated from the manifest (pillow encodes the images it returns).
tools = ["strands-agents>=1.0", "pillow>=10"]
# The mesh over zenoh (peer mode, zero config on a LAN). Same pin as above.
mesh = ["eclipse-zenoh>=1.9.0,<1.11.0", "cryptography>=42"]
# The mesh over AWS IoT Core (Direct Messaging for rpcs, MQTT for state).
iot = ["awsiotsdk>=1.31", "boto3>=1.43.17", "cryptography>=42"]  # cryptography: the local CSR with CN=<device id>
# The dashboard: a loopback web server and the world in a browser tab (the page's chat also needs [tools]).
dashboard = ["fastapi>=0.115", "uvicorn>=0.35", "websockets>=13"]
# Everything that installs from PyPI on any machine (the GPU extras isaac/newton are their own lines, LeRobot is
# _extras.LEROBOT): `uv pip install -e ".[all]"`.
all = ["strands-robots[mujoco,feetech,onnx,lerobot,tools,mesh,iot,dashboard]"]
dev = ["pytest>=8", "pytest-timeout", "ruff>=0.6", "mypy>=1.10", "import-linter>=2.1", "onnx>=1.16", "moto[iot]>=5"]

[tool.hatch.build.targets.wheel]
packages = ["strands_robots"]

[tool.hatch.envs.default]
features = ["dev", "mujoco", "onnx", "mesh", "tools", "iot", "dashboard"]

[tool.hatch.envs.default.scripts]
lint = [
    "ruff check strands_robots tests tests_integ",
    "ruff format --check strands_robots tests tests_integ",
    "mypy strands_robots",
    "lint-imports",
]
format = ["ruff check --fix strands_robots tests tests_integ", "ruff format strands_robots tests tests_integ"]
test = "pytest {args}"

# The LeRobot policy tests need the [lerobot] extra (torch, Python 3.12): `hatch run lerobot:test`.
[tool.hatch.envs.lerobot]
python = "3.12"
features = ["dev", "mujoco", "lerobot"]
dependencies = ["lerobot[remote,feetech,dataset] @ git+https://github.com/huggingface/lerobot@53feaef37b67e8f4c23b6953e880ff535e39d6fe"]

[tool.hatch.envs.lerobot.scripts]
test = "pytest tests/policy tests/recording tests/test_policy_factory.py tests/test_units_lerobot_modes.py tests/test_units_lerobot_calibrated.py {args}"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["network: talks to the internet (GitHub / Hugging Face); deselect with -m 'not network'"]

[tool.importlinter]
root_package = "strands_robots"

[[tool.importlinter.contracts]]
name = "types is a leaf: it imports nothing else in the package"
type = "forbidden"
source_modules = ["strands_robots.types"]
forbidden_modules = [
    "strands_robots.geometry",
    "strands_robots.description",
    "strands_robots.simulation",
    "strands_robots.robot",
    "strands_robots.policy",
    "strands_robots.units",
]

[[tool.importlinter.contracts]]
name = "description depends only on types, _gl, _extras"
type = "forbidden"
source_modules = ["strands_robots.description"]
forbidden_modules = [
    "strands_robots.geometry",
    "strands_robots.simulation",
    "strands_robots.robot",
    "strands_robots.policy",
    "strands_robots.units",
]

[[tool.importlinter.contracts]]
name = "simulation does not import robot or policy (except the lazy Simulation.run edge)"
type = "forbidden"
source_modules = ["strands_robots.simulation"]
forbidden_modules = ["strands_robots.robot", "strands_robots.policy"]
ignore_imports = [
    # Simulation.run delegates to the one run loop by a lazy import inside the method, and the two
    # TYPE_CHECKING-only names it annotates with; none is a runtime module-level edge.
    "strands_robots.simulation.simulation -> strands_robots.robot.run.lockstep",
    "strands_robots.simulation.simulation -> strands_robots.robot.run.result",
    "strands_robots.simulation.simulation -> strands_robots.robot",
    "strands_robots.simulation.simulation -> strands_robots.policy",
    # Simulation.tool builds the agent tool by a lazy import inside the property.
    "strands_robots.simulation.simulation -> strands_robots.tools.agent",
]

[[tool.importlinter.contracts]]
name = "policy imports neither simulation nor the drivers"
type = "forbidden"
source_modules = ["strands_robots.policy"]
forbidden_modules = ["strands_robots.simulation", "strands_robots.robot.drivers"]

[[tool.importlinter.contracts]]
name = "the mesh never imports policy"
type = "forbidden"
source_modules = ["strands_robots.mesh"]
forbidden_modules = ["strands_robots.policy"]
# The mesh imports robot.safety (RequestRefused), and the robot package runs policies; no mesh module may.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "robot.safety and robot.device import no policy, no simulation backend"
type = "forbidden"
source_modules = ["strands_robots.robot.safety", "strands_robots.robot.device"]
forbidden_modules = ["strands_robots.policy", "strands_robots.simulation.backends"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "recording depends only on types, description and units (the run loop calls it, never the reverse)"
type = "forbidden"
source_modules = ["strands_robots.recording"]
forbidden_modules = [
    "strands_robots.geometry",
    "strands_robots.simulation",
    "strands_robots.robot",
    "strands_robots.policy",
]

[[tool.importlinter.contracts]]
name = "units depends only on types and description"
type = "forbidden"
source_modules = ["strands_robots.units"]
forbidden_modules = [
    "strands_robots.geometry",
    "strands_robots.simulation",
    "strands_robots.robot",
    "strands_robots.policy",
]

