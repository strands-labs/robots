<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t">
<title id="t">broadcast('estop'). The controller publishes once on the tenant @estop key; every mesh in the tenant latches its matching devices on hearing it, drawn in red, with no discovery and no queue. In parallel one estop rpc goes to each discovered match; their replies are the acks, drawn in green.</title>
