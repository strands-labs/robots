<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t">
<title id="t">Two zenoh peers in one tenant. Left, the controller mesh me (alice@laptop). Right, the bench mesh with so101 and unitree_g1 mounted, and a second OS process with so101-b. Presence tokens flow to the controller; discover, invoke act, subscribe state and connect each light in turn; every act lands in the device's own safety chain.</title>
