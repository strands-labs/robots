<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t">
<title id="t">The safety chain. A write from an agent, the dashboard or the mesh enters at the left and passes range, safe, interlocks, validators and the operator gate in order, each lit green in turn, before it reaches the body. Any step can refuse with RequestRefused. Your own robot.act skips the chain; robot.estop bypasses it entirely, drawn in red, and latches.</title>
