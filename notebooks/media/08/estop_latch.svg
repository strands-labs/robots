<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t">
<title id="t">The e-stop latch as a timeline. A run writes ticks; estop(by='alice') latches stop number 1 and the next tick ends the run with stopped_by='estop'. While latched every write is refused with EStopped. A resume without approved_by is refused; resume(approved_by='alice', stop=1) releases it. If a second stop by bob lands first, alice's yes for stop 1 is refused.</title>
<rect width="1000" height="300" fill="#fff"/>
<g fill="none" stroke="#d9d9d9" stroke-width="1"><line x1="40" y1="0" x2="40" y2="300"/><line x1="80" y1="0" x2="80" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/><line x1="160" y1="0" x2="160" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/><line x1="280" y1="0" x2="280" y2="300"/><line x1="320" y1="0" x2="320" y2="300"/><line x1="360" y1="0" x2="360" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/><line x1="440" y1="0" x2="440" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/><line x1="520" y1="0" x2="520" y2="300"/><line x1="560" y1="0" x2="560" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/><line x1="640" y1="0" x2="640" y2="300"/><line x1="680" y1="0" x2="680" y2="300"/><line x1="720" y1="0" x2="720" y2="300"/><line x1="760" y1="0" x2="760" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/><line x1="840" y1="0" x2="840" y2="300"/><line x1="880" y1="0" x2="880" y2="300"/><line x1="920" y1="0" x2="920" y2="300"/><line x1="960" y1="0" x2="960" y2="300"/><line x1="0" y1="40" x2="1000" y2="40"/><line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="280" x2="1000" y2="280"/></g>
<g font-family="'JetBrains Mono',ui-monospace,monospace"><rect x="30" y="60" width="170" height="70" rx="6" fill="#fff" stroke="#3d3c3c" stroke-width="1.5"><animate attributeName="stroke" values="#3d3c3c;#3d3c3c;#007a3d;#007a3d;#3d3c3c;#3d3c3c" keyTimes="0;0.0300;0.0300;0.1800;0.1800;1" dur="10.0s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;1.5;3;3;1.5;1.5" keyTimes="0;0.0300;0.0300;0.1800;0.1800;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="115.0" y="91.0" text-anchor="middle" font-size="15" fill="#000">run</text><text x="115.0" y="111.0" text-anchor="middle" font-size="11" fill="#3d3c3c">ticks write</text></g>
<g font-family="'JetBrains Mono',ui-monospace,monospace"><rect x="222" y="60" width="170" height="70" rx="6" fill="#fff" stroke="#3d3c3c" stroke-width="1.5"><animate attributeName="stroke" values="#3d3c3c;#3d3c3c;#cf222e;#cf222e;#3d3c3c;#3d3c3c" keyTimes="0;0.2000;0.2000;0.3500;0.3500;1" dur="10.0s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;1.5;3;3;1.5;1.5" keyTimes="0;0.2000;0.2000;0.3500;0.3500;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="307.0" y="91.0" text-anchor="middle" font-size="15" fill="#000">estop(by='alice')</text><text x="307.0" y="111.0" text-anchor="middle" font-size="11" fill="#3d3c3c">latch #1</text></g>
<line x1="200" y1="95" x2="220" y2="95" stroke="#3d3c3c" stroke-width="1.5"/><polygon points="220,95 212,91 212,99" fill="#3d3c3c"/>
<g font-family="'JetBrains Mono',ui-monospace,monospace"><rect x="414" y="60" width="170" height="70" rx="6" fill="#fff" stroke="#3d3c3c" stroke-width="1.5"><animate attributeName="stroke" values="#3d3c3c;#3d3c3c;#cf222e;#cf222e;#3d3c3c;#3d3c3c" keyTimes="0;0.3600;0.3600;0.5100;0.5100;1" dur="10.0s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;1.5;3;3;1.5;1.5" keyTimes="0;0.3600;0.3600;0.5100;0.5100;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="499.0" y="91.0" text-anchor="middle" font-size="15" fill="#000">act()</text><text x="499.0" y="111.0" text-anchor="middle" font-size="11" fill="#3d3c3c">EStopped</text></g>
<line x1="392" y1="95" x2="412" y2="95" stroke="#3d3c3c" stroke-width="1.5"/><polygon points="412,95 404,91 404,99" fill="#3d3c3c"/>
<g font-family="'JetBrains Mono',ui-monospace,monospace"><rect x="606" y="60" width="170" height="70" rx="6" fill="#fff" stroke="#3d3c3c" stroke-width="1.5"><animate attributeName="stroke" values="#3d3c3c;#3d3c3c;#cf222e;#cf222e;#3d3c3c;#3d3c3c" keyTimes="0;0.5200;0.5200;0.6700;0.6700;1" dur="10.0s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;1.5;3;3;1.5;1.5" keyTimes="0;0.5200;0.5200;0.6700;0.6700;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="691.0" y="91.0" text-anchor="middle" font-size="15" fill="#000">resume()</text><text x="691.0" y="111.0" text-anchor="middle" font-size="11" fill="#3d3c3c">needs approved_by</text></g>
<line x1="584" y1="95" x2="604" y2="95" stroke="#3d3c3c" stroke-width="1.5"/><polygon points="604,95 596,91 596,99" fill="#3d3c3c"/>
<g font-family="'JetBrains Mono',ui-monospace,monospace"><rect x="798" y="60" width="170" height="70" rx="6" fill="#fff" stroke="#3d3c3c" stroke-width="1.5"><animate attributeName="stroke" values="#3d3c3c;#3d3c3c;#007a3d;#007a3d;#3d3c3c;#3d3c3c" keyTimes="0;0.6800;0.6800;0.8300;0.8300;1" dur="10.0s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;1.5;3;3;1.5;1.5" keyTimes="0;0.6800;0.6800;0.8300;0.8300;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="883.0" y="91.0" text-anchor="middle" font-size="15" fill="#000">resume(stop=1)</text><text x="883.0" y="111.0" text-anchor="middle" font-size="11" fill="#3d3c3c">alice: released</text></g>
<line x1="776" y1="95" x2="796" y2="95" stroke="#3d3c3c" stroke-width="1.5"/><polygon points="796,95 788,91 788,99" fill="#3d3c3c"/>
<text x="30" y="185" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#3d3c3c">a later stop pins the yes:</text>
<text x="30" y="215" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#000">estop(by="bob")  →  latch #2  →  resume(approved_by="alice", stop=1)</text>
<text x="30" y="245" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#cf222e">RequestRefused: resume is for stop #1, but the current stop is #2; approve the stop you saw<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.87;1" dur="10.0s" repeatCount="indefinite"/></text>
</svg>
