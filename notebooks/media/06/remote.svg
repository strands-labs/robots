<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t">
<title id="t">Top: robot.run in this process sends one frame over Zenoh to a lerobot-policy-server process, which answers with a whole action chunk; a dot travels right with the frame, then left with the chunk. Bottom: two timelines of control ticks. Sequential: the arm holds (grey ticks, act returns None) while the chunk is on its way, then plays its rows (green ticks), then asks again only when the queue is empty. Splice: the next chunk is requested before the queue empties, so every tick plays a row and none holds.</title>
<style>
text{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#000}
.h{font-size:16px;font-weight:600}.s{font-size:13px;fill:#3d3c3c}.k{font-size:12px;fill:#3d3c3c}
.card{fill:#fff;stroke:#3d3c3c;stroke-width:1.2}.w{fill:none;stroke:#b6b6b6;stroke-width:1.2}
.hold{fill:#d9d9d9}.play{fill:#007a3d}.ask{fill:none;stroke:#007a3d;stroke-width:1.5}
.cur{stroke:#02a435;stroke-width:2}
</style>
<rect width="1000" height="460" fill="#fff"/>
<g stroke="#d9d9d9" stroke-width="1"><path d="M0 60H1000M0 120H1000M0 180H1000M0 240H1000M0 300H1000M0 360H1000M0 420H1000M200 0V460M400 0V460M600 0V460M800 0V460"/></g>
<g transform="translate(24,30)"><rect class="card" width="280" height="110" rx="8"/><text class="h" x="16" y="34">robot.run(policy)</text><text class="s" x="16" y="60">this process, the sim arm</text><text class="k" x="16" y="86">Policy("zenoh://host:7450/act")</text></g>
<g transform="translate(696,30)"><rect class="card" width="280" height="110" rx="8"/><text class="h" x="16" y="34">lerobot-policy-server</text><text class="s" x="16" y="60">another process, the model</text><text class="k" x="16" y="86">--config_path=act.yaml</text></g>
<path class="w" d="M304 72H696"/><path class="w" d="M304 100H696"/>
